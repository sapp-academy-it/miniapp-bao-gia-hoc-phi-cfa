function h(tag,props={},...children){const el=document.createElement(tag);for(const[key,value]of Object.entries(props)){if(key==='class')el.className=value;else if(key.startsWith('on')&&typeof value==='function')el.addEventListener(key.slice(2),value);else if(key==='value')el.value=value??'';else if(key==='checked')el.checked=Boolean(value);else if(value!==false&&value!=null)el.setAttribute(key,value===true?'':value)}el.append(...children.flat().filter(x=>x!=null&&x!==false));return el}
const app=document.getElementById('app'),DAY=86400000,MODE_LABEL={ONLINE:'Record Online',LIVE_ONLINE:'Live Online',OFFLINE:'Face to face',BLENDED:'BLENDED',HYBRID:'HYBRID',OTHER:'OTHER'}

const clone=x=>JSON.parse(JSON.stringify(x));function readLocal(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{return fallback}}function writeLocal(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
const todayYmd=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),dateOf=ymd=>ymd?new Date(`${ymd}T00:00:00+07:00`):null,ymdOfIso=iso=>iso?new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso)):''
function fmtDate(value){if(!value)return'—';const date=String(value).includes('T')?new Date(value):dateOf(value);return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric'}).format(date)}const fmtVnd=value=>Number.isFinite(Number(value))?new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(Number(value)):'—',fmtPercent=value=>`${Number(value||0).toLocaleString('vi-VN',{maximumFractionDigits:1})}%`,diffDays=(from,to)=>Math.round((dateOf(to)-dateOf(from))/DAY)

function levelOfSubject(subject){const text=`${subject?.name||''} ${subject?.code||''}`.toUpperCase();if(/LEVEL[\s-]*(3|III)\b/.test(text))return 3;if(/LEVEL[\s-]*(2|II)\b/.test(text))return 2;if(/LEVEL[\s-]*(1|I)\b/.test(text))return 1;return null}const levelOfClass=item=>levelOfSubject(item.course?.subject),isCfaClass=item=>levelOfClass(item)&&(item.course?.course_categories||[]).some(x=>String(x?.name).trim().toUpperCase()==='CFA'),isCfaProduct=item=>levelOfSubject(item.subject)&&String(item.course_category?.name).trim().toUpperCase()==='CFA'
const state={tab:'quote',loading:false,error:'',studentMode:false,classes:[],products:[],provinceByFacility:{},productChoice:{},copyMessage:'',copyFallback:'',advisor:readLocal('sapp-cfa-advisor',{name:'',phone:'',email:''}),policy:readLocal('sapp-cfa-policy',clone(DEFAULT_POLICY)),quote:{student:{name:'',phone:'',email:''},firstClassId:'',levelCount:1,next:[],quoteDate:todayYmd(),completionDate:'',group:false,originalOnly:true,scholarship:'',partner:''},schedule:{level:'',mode:'',region:''}}
function selectedClass(){return state.classes.find(x=>x.id===state.quote.firstClassId)||null}function provinceOfClass(item){return normalizeProvince(state.provinceByFacility[item?.facility?.id||item?.facility_id]||'')}function futureClasses(){const today=todayYmd();return state.classes.filter(x=>x.opening_at&&ymdOfIso(x.opening_at)>=today).sort((a,b)=>new Date(a.opening_at)-new Date(b.opening_at))}function availableModes(level){const order=['ONLINE','LIVE_ONLINE','OFFLINE','BLENDED','HYBRID','OTHER'];return[...new Set(state.products.filter(x=>levelOfSubject(x.subject)===level).map(x=>x.construction_mode))].sort((a,b)=>order.indexOf(a)-order.indexOf(b))}function priceOptions(level,mode){return state.products.filter(x=>levelOfSubject(x.subject)===level&&x.construction_mode===mode)}
function priceResolution(item,index){const options=priceOptions(item.level,item.mode),chosen=options.find(x=>x.id===state.productChoice[index]);if(chosen)return{price:Number(chosen.price),product:chosen,ambiguous:false};const prices=[...new Set(options.map(x=>Number(x.price)).filter(Number.isFinite))];if(prices.length===1)return{price:prices[0],product:options[0],ambiguous:false};return{price:null,product:null,ambiguous:prices.length>1,options}}
function syncPath(){const first=selectedClass(),start=levelOfClass(first);if(!start)return;state.quote.levelCount=Math.max(1,Math.min(Number(state.quote.levelCount),4-start));const next=[];for(let i=1;i<state.quote.levelCount;i++){const level=start+i,old=state.quote.next[i-1]||{},modes=availableModes(level),mode=modes.includes(old.mode)?old.mode:modes.includes(first.instruction_mode)?first.instruction_mode:modes[0]||'';next.push({mode,region:old.region||'Hà Nội'})}state.quote.next=next}function chooseFirstClass(id,resetDate=true){state.quote.firstClassId=id;state.productChoice={};syncPath();const first=selectedClass();if(resetDate&&first?.opening_at)state.quote.completionDate=addDays(ymdOfIso(first.opening_at),-63)}
