name: Repair JavaScript syntax
on:
  push:
    branches: [fix-trang-trang]
permissions:
  contents: write
  pull-requests: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-trang-trang
      - name: Thay hàm lỗi bằng bản đã cân dấu ngoặc
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacement = '''function renderRateTable(title, rows) {
            return h(
              'div',
              { class: 'policy-block' },
              h('h3', {}, title),
              h(
                'div',
                { class: 'table-wrap' },
                h(
                  'table',
                  { class: 'table' },
                  h(
                    'thead',
                    {},
                    h(
                      'tr',
                      {},
                      h('th', {}, 'Đối tượng'),
                      h('th', { class: 'num' }, 'Mức (%)')
                    )
                  ),
                  h(
                    'tbody',
                    {},
                    rows.map((row) =>
                      h(
                        'tr',
                        {},
                        h('td', {}, row.label),
                        h(
                          'td',
                          { class: 'num' },
                          numberInput(
                            row.rate,
                            (event) => {
                              row.rate = Number(event.target.value)
                              renderApp()
                            },
                            '.1'
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
          }'''
          pattern = r"function renderRateTable\(title,rows\)\{[^\n]*\}\nfunction renderPolicy"
          updated, count = re.subn(pattern, replacement + '\nfunction renderPolicy', text, count=1)
          if count != 1:
              raise SystemExit(f'Không thay được đúng một hàm: {count}')
          path.write_text(updated, encoding='utf-8')

          scripts = re.findall(r'<script>([\s\S]*?)</script>', updated)
          if len(scripts) != 1:
              raise SystemExit(f'Số khối script không đúng: {len(scripts)}')
          Path('/tmp/app.js').write_text(scripts[0], encoding='utf-8')
          PY
      - name: Kiểm tra cú pháp JavaScript
        id: syntax
        shell: bash
        run: |
          set +e
          node --check /tmp/app.js > /tmp/syntax.log 2>&1
          code=$?
          cat /tmp/syntax.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Báo lỗi vào pull request
        if: steps.syntax.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Kiểm tra cú pháp vẫn lỗi:'
            echo '```text'
            cat /tmp/syntax.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 1 --body-file /tmp/comment.md
          exit 1
      - name: Ghi bản sửa đã kiểm tra vào nhánh
        if: steps.syntax.outputs.exit_code == '0'
        shell: bash
        run: |
          rm .github/workflows/repair-syntax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/repair-syntax.yml
          git commit -m "fix: sửa lỗi cú pháp khiến trang trắng"
          git push origin HEAD:fix-trang-trang
